name = "banproof-me"
main = "src/index.ts"
compatibility_date = "2026-04-02"
workers_dev = false

[vars]
# Toggle for testing logic without burning API credits
USE_MOCK = "true"
ENVIRONMENT = "staging"

[env.production]

[[env.production.routes]]
pattern = "banproof.me/*"
zone_name = "banproof.me"

[[env.production.routes]]
pattern = "www.banproof.me/*"
zone_name = "banproof.me"

# Production-only D1 database binding
[[env.production.d1_databases]]
binding = "DB"
database_name = "gs_platform_db"
database_id = "9703574e-adb7-481e-8d98-96f8ce5f8a90"

# Shared KV namespace for runtime secrets
[[env.production.kv_namespaces]]
binding = "INFRA_SECRETS"
id = "0c45009b68c944d6988a5268bdaa7361"
