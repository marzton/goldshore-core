name            = "goldshore-admin"
main            = "src/index.ts"
compatibility_date = "2026-04-02"

# ── Shared D1 instance: gs-platform-prod ─────────────────────────────────────
# Replace database_id with the UUID from `wrangler d1 create gs-platform-prod`
[[d1_databases]]
binding         = "DB"
database_name   = "gs-platform-prod"
database_id     = "YOUR_D1_DATABASE_ID"
migrations_dir  = "../../packages/db/migrations/d1"

# ── Shared KV namespace: INFRA_SECRETS ────────────────────────────────────────
[[kv_namespaces]]
binding = "INFRA_SECRETS"
id      = "0c45009b68c944d6988a5268bdaa7361"
