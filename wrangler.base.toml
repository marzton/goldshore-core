# wrangler.base.toml — DOCUMENTATION ONLY
#
# Wrangler does not support config inheritance. This file documents the shared
# binding contract that every app in the monorepo must declare independently.
#
# After provisioning `gs-platform-prod` + `INFRA_SECRETS`, update:
#   - apps/banproof-me/wrangler.toml
#   - apps/goldshore-ai/wrangler.toml
#   - apps/admin-dashboard/wrangler.toml
# … and `infra/bindings.json` (`d1.primary.id` and `kv.primary.id`).
#
# `infra/bindings.json` also tracks non-primary catalog entries (KV/R2/D1)
# discovered in Cloudflare dashboard for cross-repo consolidation audits.
#
# ── Shared D1 binding ────────────────────────────────────────────────────────
# [[d1_databases]]
# binding       = "DB"
# database_name = "gs-platform-prod"
# database_id   = "<UUID returned by wrangler d1 create>"
#
# ── Shared KV binding ────────────────────────────────────────────────────────
# [[kv_namespaces]]
# binding = "INFRA_SECRETS"
# id      = "<UUID returned by wrangler kv:namespace create>"
#
# ── KV secrets to populate at deploy-time ───────────────────────────────────
# wrangler kv:key put --namespace-id=<id> HUGGINGFACE_API_KEY  <value>
# wrangler kv:key put --namespace-id=<id> ODDS_API_KEY         <value>
# wrangler kv:key put --namespace-id=<id> DISCORD_BOT_TOKEN    <value>
# wrangler kv:key put --namespace-id=<id> JWT_SECRET           <value>
#
# ── D1 migrations ────────────────────────────────────────────────────────────
# D1-compatible SQL lives in packages/db/migrations/d1/ (SQLite-safe only).
# PostgreSQL migrations (packages/db/drizzle/) must NOT be passed to wrangler.
#
# Run migrations against the remote D1 instance:
#   wrangler d1 migrations apply gs-platform-prod \
#     --config apps/admin-dashboard/wrangler.toml
#
# The admin-dashboard wrangler.toml declares:
#   migrations_dir = "../../packages/db/migrations/d1"
# so the --config flag above is sufficient (no separate --migrations-dir needed).
#
# Migration files in packages/db/migrations/d1/:
#   0001_platform_tables.sql  — users, inquiries, signals, audit_logs (D1/SQLite)
