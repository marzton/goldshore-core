name: api-auth-checks

on:
  pull_request:
  push:
    branches: ["main", "work"]

jobs:
  api-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=apps/api
