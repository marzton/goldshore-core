name: GS production secret contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-secret-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sk-proj-[A-Za-z0-9_-]{20,}|CF_MCP_AGENT_TOKEN=.+|GH_MCP_AGENT_TOKEN=.+' -- ':!*.md' ':!*.example' ':!*.example.*'; then
            echo 'Potential credential value committed to repository.' >&2
            exit 1
          fi

      - name: Confirm canonical configuration names
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OPENAI_API_KEY' docs/security/GS_PROD_SECRET_CONTRACT.md
          grep -q 'GS_CONFIG' docs/security/GS_PROD_SECRET_CONTRACT.md
          grep -q 'Gold Shore Labs' docs/security/GS_PROD_SECRET_CONTRACT.md

  production-secret-smoke-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: GS-WEB-PROD
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required secrets are available
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          echo 'Required GS-WEB-PROD secret names are populated.'
